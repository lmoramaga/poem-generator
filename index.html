<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI French Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI French Poem Generator</h1>
      </header>

      <main>
        <form>
          <input
            type="text"
            placeholder="Enter the topic of the French poem"
            autofocus
            required
            autocomplete="off"
            class="instruction"
          />
          <input type="Submit" class="submit-button" />
        </form>
        <div class="poem">
          Demain, dès l’aube, à l’heure où blanchit la campagne,
          <br />
          Je partirai. Vois-tu, je sais que tu m’attends.
        </div>
      </main>
      <footer>
        This AI project was coded by
        <a href="https://github.com/lmoramaga" target="_blank">Lina Moramaga</a>
        and is
        <a href="https://github.com/lmoramaga/poem-generator" target="_blank"
          >open-sourced</a
        >
      </footer>
    </div>
  </body>
</html>
